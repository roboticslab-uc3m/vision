name: Continuous Integration

on:
  push:
    paths-ignore:
    - .github/workflows/docker.yml
    - .github/workflows/doxygen.yml
    - 'doc/**'
    - 'docker/**'
    - '**.md'
  pull_request:
  schedule:
  - cron: '0 0 * * SAT'
  workflow_dispatch:

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CMAKE_BUILD_TYPE: Debug

jobs:
  maybe_skip:
    runs-on: ubuntu-slim
    outputs:
      should_skip: ${{steps.skip_check.outputs.should_skip}}
    steps:
    - uses: fkirc/skip-duplicate-actions@v5
      id: skip_check
      with:
        cancel_others: 'true'

  build:
    name: build (${{matrix.system.os}}, ${{matrix.robotology.yarp}}, ${{matrix.compiler.cc}})
    runs-on: ${{matrix.system.os}}
    container:
      image: ghcr.io/roboticslab-uc3m/vision:${{matrix.system.os}}-opencv-${{matrix.system.opencv}}
      env:
        DEBIAN_FRONTEND: noninteractive
    needs: maybe_skip
    if: ${{needs.maybe_skip.outputs.should_skip != 'true'}}

    strategy:
      fail-fast: false
      matrix:
        system:
        - { os: ubuntu-24.04, opencv: 4.x, ros: jazzy }
        - { os: ubuntu-26.04, opencv: 5.x, ros: lyrical }
        compiler:
        - { cc: gcc,   cxx: g++ }
        - { cc: clang, cxx: clang++ }
        robotology:
        # CMake 3.22 instead of 3.19 because of the CMAKE_BUILD_TYPE env var
        - { yarp: yarp-3.11, cmake: 3.22.x }
        - { yarp: yarp-3.12, cmake: 3.22.x }
        - { yarp: master,    cmake: 3.22.x }
        experimental:
        - ${{github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'}}
        exclude:
        - { experimental: false, robotology: { yarp: master } }

    steps:
    - name: Check out main project
      uses: actions/checkout@v7

    - name: Check out YCM
      uses: actions/checkout@v7
      with:
        repository: robotology/ycm
        path: .deps/ycm

    - name: Check out YARP
      uses: actions/checkout@v7
      with:
        repository: robotology/yarp
        ref: ${{matrix.robotology.yarp}}
        path: .deps/yarp

    # Silly clang/gcc16 apt mismatch due to PCL; see alternatives: https://stackoverflow.com/a/74605488
    - name: Install dependencies via apt
      if: ${{matrix.system.os == 'ubuntu-26.04' && matrix.compiler.cc == 'clang'}}
      run: apt-get update && apt-get install -qq libstdc++-16-dev

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: ${{matrix.robotology.cmake}}

    - name: Set up Ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{matrix.system.os}}-${{matrix.robotology.yarp}}-${{matrix.compiler.cc}}

    - name: Set up model cache
      uses: actions/cache@v4
      with:
        path: models
        key: vision-models-${{hashFiles('models/**/*')}}

    - name: Set environment variables
      run: |
        echo "CC=${{matrix.compiler.cc}}" >> $GITHUB_ENV
        echo "CXX=${{matrix.compiler.cxx}}" >> $GITHUB_ENV

    - name: Build YCM
      run: |
        cmake -S .deps/ycm -B .deps/ycm/build
        cmake --build .deps/ycm/build
        cmake --install .deps/ycm/build

    - name: Build YARP
      run: |
        cmake -S .deps/yarp -B .deps/yarp/build -DSKIP_ACE=ON -DYARP_DISABLE_VERSION_SOURCE=ON
        cmake --build .deps/yarp/build
        cmake --install .deps/yarp/build

    - name: Configure main project
      run: |
        . /opt/ros/${{matrix.system.ros}}/setup.sh
        cmake -S . -B build -DCREATE_BINDINGS_PYTHON=ON -DENABLE_examples=ON -DALLOW_DEVICE_PARAM_PARSER_GENERATION=ON

    - name: Compile main project
      run: |
        . /opt/ros/${{matrix.system.ros}}/setup.sh
        cmake --build build

    - name: Install main project
      run: cmake --install build && ldconfig

    - name: Test main project
      working-directory: build
      run: ctest -V

    - name: Uninstall main project
      run: cmake --build build --target uninstall
