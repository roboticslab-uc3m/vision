name: Docker

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{github.repository}}

jobs:
  docker:
    name: build (ubuntu-${{matrix.system.ubuntu}}, opencv-${{matrix.system.opencv}})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        system:
        - { ubuntu: '24.04', opencv: '4.x', ros: jazzy }
        - { ubuntu: '26.04', opencv: '5.x', ros: lyrical }

    steps:
    - name: Check out main project
      uses: actions/checkout@v7

    - name: Log in to the Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{env.REGISTRY}}
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        context: docker
        tags: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}:ubuntu-${{matrix.system.ubuntu}}-opencv-${{matrix.system.opencv}}
        labels: ${{steps.meta.outputs.labels}}
        build-args: |
          OPENCV_TAG=${{matrix.system.opencv}}
          ROS_TAG=${{matrix.system.ros}}
